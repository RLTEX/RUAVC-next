name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tools tests
      - run: python tools/build.py
      - run: bash -n dist/ruavc-setup.sh && bash dist/ruavc-setup.sh --help
      - run: python dist/ruavc.pyz version
      - run: shellcheck -s bash packaging/setup.sh.in
      - run: python tools/check_tree.py
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        ubuntu: ['22.04', '24.04', '26.04']
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Real Xray and nginx on each supported Ubuntu/architecture
        timeout-minutes: 20
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        # NET_ADMIN only inside the disposable container: the local probe endpoint
        # gets a non-private address on lo, so no third-party site is involved.
        run: |
          set -o pipefail
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/source:ro" "ubuntu:$UBUNTU" bash -c '
            set -e
            apt-get -o Acquire::Retries=5 update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y -qq python3 ca-certificates curl openssl nginx iproute2
            cp -r /source /test
            chown -R root:root /test
            cd /test
            python3 -m unittest discover -s tests -v
            python3 tools/build.py
            python3 tests/integration.py
          ' 2>&1 | tee "$RUNNER_TEMP/linux.log"
      - name: Full installation under systemd
        timeout-minutes: 25
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        # A privileged throwaway container boots systemd as PID 1, like a VPS.
        # nginx is preinstalled only for the local fixtures and left disabled.
        run: |
          set -o pipefail
          {
            cat > "$RUNNER_TEMP/Dockerfile" <<'EOF'
          ARG UBUNTU
          FROM ubuntu:${UBUNTU}
          RUN apt-get -o Acquire::Retries=5 update -qq \
           && DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y -qq systemd systemd-sysv python3 ca-certificates curl openssl nginx iproute2 \
           && rm -f /etc/systemd/system/multi-user.target.wants/nginx.service
          CMD ["/lib/systemd/systemd"]
          EOF
            # Ubuntu mirrors occasionally serve a half-synced index; retry the image only.
            for attempt in 1 2 3; do
              docker build -q -t ruavc-vps --build-arg UBUNTU="$UBUNTU" - < "$RUNNER_TEMP/Dockerfile" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 20
            done
            docker run -d --name vps --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run:exec --tmpfs /run/lock -e container=docker -v "$PWD:/source:ro" ruavc-vps
            for _ in $(seq 90); do
              docker exec vps test -S /run/systemd/private && break
              sleep 1
            done
            docker exec vps test -S /run/systemd/private || { docker logs vps; exit 1; }
            docker exec vps bash -c 'systemctl is-system-running --wait || systemctl --failed --no-pager'
            docker exec vps bash -c '
              set -e
              cp -r /source /test
              chown -R root:root /test
              cd /test
              python3 tools/build.py
              python3 tests/systemd_integration.py
            '
          } 2>&1 | tee "$RUNNER_TEMP/linux.log"
      - name: Report failure
        if: failure()
        # Annotations stay readable without access to the full job log.
        run: |
          test -f "$RUNNER_TEMP/linux.log" || exit 0
          tail -n 150 "$RUNNER_TEMP/linux.log" | split -l 30 - "$RUNNER_TEMP/part-"
          for part in "$RUNNER_TEMP"/part-*; do
            body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$part" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=log $(basename "$part")::$body"
          done
