name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tools tests
      - run: python tools/build.py
      - run: bash -n dist/ruavc-setup.sh && bash dist/ruavc-setup.sh --help
      - run: python dist/ruavc.pyz version
      - run: shellcheck -s bash packaging/setup.sh.in
      - run: python tools/check_tree.py
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        ubuntu: ['22.04', '24.04', '26.04']
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Real Xray and nginx on each supported Ubuntu/architecture
        timeout-minutes: 20
        env:
          UBUNTU: ${{ matrix.ubuntu }}
        # NET_ADMIN only inside the disposable container: the local probe endpoint
        # gets a non-private address on lo, so no third-party site is involved.
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/source:ro" "ubuntu:$UBUNTU" bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 ca-certificates curl openssl nginx iproute2
            cp -r /source /test
            chown -R root:root /test
            cd /test
            python3 -m unittest discover -s tests -v
            python3 tools/build.py
            python3 tests/integration.py
          '
